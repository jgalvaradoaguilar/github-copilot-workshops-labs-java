            - generic [ref=e2635]:
              - paragraph [ref=e2636]: "TIEBREAKER BASIS FOR TWO-WAY TIES:"
              - list [ref=e2637]:
                - listitem [ref=e2638]: (-) Tie breaker not needed (better overall winning percentage)
                - listitem [ref=e2639]: (1) Head-to-head won-lost percentage
                - listitem [ref=e2640]: (2) Division leader wins tie from team not leading a division
                - listitem [ref=e2641]: (3) Division won-lost percentage for teams in the same division
                - listitem [ref=e2642]: (4) Conference won-lost percentage
                - listitem [ref=e2643]: (5) W-L Percentage vs. Playoff eligible teams, own conference
                - listitem [ref=e2644]: (6) W-L Percentage vs. Playoff eligible teams, other conference
                - listitem [ref=e2645]: (7) Net Points, all games
            - generic [ref=e2646]:
              - paragraph [ref=e2647]: "TIEBREAKER BASIS FOR MULTI-WAY TIES:"
              - list [ref=e2648]:
                - listitem [ref=e2649]: (-) Tie breaker not needed (better overall winning percentage)
                - listitem [ref=e2650]: (1) Division leader wins tie from team not leading a division
                - listitem [ref=e2651]: (2) Head-to-head won-lost percentage
                - listitem [ref=e2652]: (3) Division won-lost percentage for teams in the same division
                - listitem [ref=e2653]: (4) Conference won-lost percentage
                - listitem [ref=e2654]: (5) W-L Percentage vs. Playoff eligible teams, own conference
                - listitem [ref=e2655]: (6) W-L Percentage vs. Playoff eligible teams, other conference
                - listitem [ref=e2656]: (7) Net Points, all games
            - generic [ref=e1179]:
              - paragraph [ref=e1180]: Ties for playoff positions (including division winners) will be broken utilizing the criteria set forth in subparagraph a. below (in the case of ties involving two teams) and subparagraph b. below (in the case of ties involving more than two teams), and the guidelines set forth in subparagraph c. below.
              - generic [ref=e2657]:
                - paragraph [ref=e2658]: "a. Two Teams Tied. In the case of a tie in regular-season records involving only two teams, the following criteria will be utilized in the following order:"
                - list [ref=e2659]:
                  - listitem [ref=e2660]: (1) Better winning percentage in games against each other.
                  - listitem [ref=e2661]: (2) Division winner (this criterion is applied regardless of whether the tied teams are in the same division).
                  - listitem [ref=e2662]: (3) Better winning percentage against teams in own division (only if tied teams are in same division).
                  - listitem [ref=e2663]: (4) Better winning percentage against teams in own conference.
                  - listitem [ref=e2664]: (5) Better winning percentage in games against teams eligible for the postseason in own conference (including teams that finished the Regular Season tied for one of the best 10 records in their conference).
                  - listitem [ref=e2665]: (6) Better winning percentage in games against teams eligible for the postseason in opposite conference (including teams that finished the Regular Season tied for one of the best 10 records in their conference).
                  - listitem [ref=e2666]: (7) Better net result of total points scored less total points allowed against all opponents ("point differential").
              - generic [ref=e2667]:
                - paragraph [ref=e2668]: "b. More Than Two Teams Tied. In the case of a tie in regular-season records involving more than two teams, the following criteria will be utilized in the following order:"
                - list [ref=e2669]:
                  - listitem [ref=e2670]: (1) Division winner (this criterion is applied regardless of whether the tied teams are in the same division).
                  - listitem [ref=e2671]: (2) Better winning percentage in all games among the tied teams.
                  - listitem [ref=e2672]: (3) Better winning percentage against teams in own division (only if all tied teams are in same division).
                  - listitem [ref=e2673]: (4) Better winning percentage against teams in own conference.
                  - listitem [ref=e2674]: (5) Better winning percentage in games against teams eligible for the postseason in own conference (including teams that finished the Regular Season tied for one of the best 10 records in their conference).
                  - listitem [ref=e2675]: (6) Better net result of total points scored less total points allowed against all opponents ("point differential").
              - generic [ref=e2676]:
                - paragraph [ref=e2677]: "c. Guidelines For Applying Tie-Break Criteria. The following guidelines shall be used when applying the above criteria to break ties for playoff positions:"
                - list [ref=e2678]:
                  - listitem [ref=e2679]: (1)(a) Ties to determine the division winners must be broken before any other ties.
                  - listitem [ref=e2680]: (b) When a tie must be broken to determine a division winner, the results of the tie-break shall be used to determine only the division winner, and not for any other purpose.
                  - listitem [ref=e2681]: "(2) If a tie involves more than two teams, the tie-break criteria in subparagraph b. shall be applied in the order set forth therein until the first to occur of the following:"
                  - listitem [ref=e2682]: (a) Each of the tied teams has a different winning percentage or point differential under the applicable tie-break criterion (a “complete” breaking of the tie). In this circumstance, the team with the best winning percentage or point differential under the criterion will be awarded the best playoff position, the team with the next-best winning percentage or point differential will be awarded the next-best playoff position, and so on, and no further application of the tie-break criteria will be required.
                  - listitem [ref=e2683]: "-- OR --"
                  - listitem [ref=e2684]: "(b) One or more (but not all) of the tied teams has a different winning percentage or point differential under the applicable tie-break criterion (a “partial” breaking of the tie). In this circumstance: (x) any team(s) that performed better under the applicable criterion than any other team(s) will be awarded a higher playoff position than such other team(s); and (y) teams that had equivalent performance under the applicable criterion will remain tied, and such remaining tie(s) will be broken by applying, from the beginning, the criteria in subparagraph a.(1)-(6) above (for any remaining tie involving only two teams) or subparagraph b.(1)-(5) above (for any remaining tie involving more than two teams) and the guidelines set forth in this subparagraph c."
                  - listitem [ref=e2685]: (3) If application of the criteria in subparagraph a. or b. does not result in the breaking of a tie, the playoff positions of the tied teams will be determined by a random drawing.
